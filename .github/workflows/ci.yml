name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Deployment is handled by Railway's own GitHub integration (auto-deploys
# from main on push). This workflow only runs static checks.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit-log coverage (every mutation must call logActivity)
        run: pnpm test:audit-coverage
