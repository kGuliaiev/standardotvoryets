name: Daily DB backup

# Daily pg_dump of the Railway Postgres into S3-compatible storage,
# with 30-day retention. Runs at 03:00 UTC (~06:00 Kyiv in summer,
# 05:00 in winter — before the morning notifications cron at 09:00).
#
# Required secrets (in repo Settings → Secrets → Actions):
#   DATABASE_URL       — Railway Postgres connection string
#   S3_ENDPOINT        — e.g. https://<account>.r2.cloudflarestorage.com
#   S3_BUCKET          — bucket name where dumps land
#   S3_REGION          — e.g. auto for R2, eu-central-1 for AWS
#   S3_ACCESS_KEY      — access key id
#   S3_SECRET_KEY      — secret access key
#
# All Railway env vars already exist on Railway side — just mirror them
# into GitHub repo secrets (same values).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: # allow manual via Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Postgres client + AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # AWS CLI is preinstalled on GitHub runners; verify it
          aws --version

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret not set"
            exit 1
          fi
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          out="standardotvorets_${ts}.sql.gz"
          echo "Dumping to ${out}"
          # --clean drops existing objects, --if-exists guards against missing
          # --no-owner / --no-privileges → portable, restore on any role
          pg_dump --no-owner --no-privileges --format=plain \
            "${DATABASE_URL}" | gzip -9 > "${out}"
          size=$(stat -c%s "${out}")
          echo "Dump size: ${size} bytes"
          if [ "${size}" -lt 1024 ]; then
            echo "::error::Dump is suspiciously small (<1KB) — failing"
            exit 1
          fi
          echo "DUMP_FILE=${out}" >> "$GITHUB_ENV"

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::${v} secret not set"
              exit 1
            fi
          done
          key="backups/${DUMP_FILE}"
          echo "Uploading to s3://${S3_BUCKET}/${key}"
          aws s3 cp "${DUMP_FILE}" "s3://${S3_BUCKET}/${key}" \
            --endpoint-url "${S3_ENDPOINT}" \
            --no-progress

      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          cutoff_epoch=$(date -u -d '30 days ago' +%s)
          # List objects under backups/ and delete those older than cutoff
          aws s3api list-objects-v2 \
            --bucket "${S3_BUCKET}" \
            --prefix "backups/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --query 'Contents[].{Key:Key, LastModified:LastModified}' \
            --output json > /tmp/objs.json || echo "[]" > /tmp/objs.json
          jq -r --arg cutoff "$cutoff_epoch" '
            map(select((.LastModified | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < ($cutoff | tonumber)))
            | .[].Key
          ' /tmp/objs.json > /tmp/to-delete.txt
          count=$(wc -l < /tmp/to-delete.txt)
          echo "Deleting ${count} objects older than 30 days"
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            aws s3 rm "s3://${S3_BUCKET}/${key}" --endpoint-url "${S3_ENDPOINT}"
          done < /tmp/to-delete.txt

      - name: Summary
        run: |
          echo "✅ Backup ${DUMP_FILE} uploaded to s3://${{ secrets.S3_BUCKET }}/backups/"
